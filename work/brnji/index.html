<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مطعم برنجي | المنيو</title>
<meta name="description" content="منيو مطعم برنجي في دير عطية: وجبات دجاج، شاورما، سندويش كريسبي، برغر، فتات ومقبلات.">
<meta name="theme-color" content="#4F498D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#4F498D;--bg-dark:#3F3A78;--card:#5A54A0;--line:rgba(255,255,255,.14);--yellow:#EFD92C;--text:#FFFFFF;--muted:#DCD9F2}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo",Tahoma,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{text-align:center;padding:28px 0 18px}
header img{width:min(210px,55vw);height:auto;display:block;margin:0 auto;border-radius:28px;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.slogan{font-family:"Lalezar",sans-serif;font-weight:400;color:var(--yellow);font-size:clamp(30px,8vw,44px);line-height:1.25;margin:14px 0 0}
nav{position:sticky;top:0;z-index:5;background:var(--bg-dark);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
nav a{flex:none;color:var(--text);text-decoration:none;font-weight:700;font-size:15px;padding:7px 16px;border-radius:999px;border:1px solid var(--line)}
nav a.on{background:var(--yellow);color:var(--bg-dark);border-color:var(--yellow)}
section{padding:22px 0 6px}
h2{font-family:"Lalezar",sans-serif;font-weight:400;font-size:32px;text-align:center;margin:0 0 14px;color:var(--text)}
.items{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.item h3{margin:0 0 6px;color:var(--yellow);font-family:"Lalezar",sans-serif;font-weight:400;font-size:21px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips li{font-size:13.5px;color:var(--muted);background:rgba(255,255,255,.08);border-radius:999px;padding:2px 10px}
.contact{margin:26px 0 10px;background:var(--bg-dark);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.contact h2{font-size:26px;margin-bottom:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;padding:10px 18px;border-radius:12px;background:var(--yellow);color:var(--bg-dark)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn svg{width:18px;height:18px}
.addr{color:var(--muted);margin:6px 0 0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.credit{text-align:center;font-size:13px;color:var(--muted);padding:18px 16px 28px}
.credit a{color:var(--yellow);font-weight:700;text-decoration:none}
.items.simple{grid-template-columns:1fr 1fr}
.items.simple .item{padding:12px 14px}
.items.simple .item h3{margin:0;font-size:19px}
@media (min-width:640px){.items{grid-template-columns:1fr 1fr}.items.simple{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<header class="wrap">
  <img src="logo.png" alt="شعار مطعم برنجي" width="900" height="900">
  <p class="slogan">خلّي أكلك برنجي</p>
</header>

<nav aria-label="أقسام المنيو"><div class="wrap" id="tabs"></div></nav>

<main class="wrap" id="menu"></main>

<div class="wrap">
  <div class="contact">
    <h2>للتواصل</h2>
    <div class="btns">
      <a class="btn" href="tel:+963997833773"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><span class="ltr">0997833773</span></a>
      <a class="btn" href="tel:+963117833773"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><span class="ltr">011 7833773</span></a>
      <a class="btn ghost" href="https://www.instagram.com/brnji_1/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg><span class="ltr">brnji_1</span></a>
    </div>
    <p class="addr">العنوان: دير عطية، الشارع العام، بجانب كيوي</p>
  </div>
</div>

<p class="credit">تصميم: سامر سعد · <a href="https://sam96sd.github.io/#web">اطلب صفحة لمحلك أو مطعمك</a></p>

<script>
const crispy = (sauce) => ["3 قطع دجاج مقلي", "مايونيز", "حبش", "تشيدر", "خس", sauce];
const MENU = [
  { id: "meals", title: "وجبات دجاج", simple: true, items: [
    ["بروستد كامل", []], ["نص بروستد", []], ["برنجي", []], ["دبوس", []], ["جوانح / جوانح بوفلو", []], ["كريسبي", []],
  ]},
  { id: "shawarma", title: "شاورما", simple: true, items: [
    ["سندويش لف", []], ["جامبو", []], ["وجبة عربي", []], ["وجبة 200 غرام", []], ["وجبة برغر شاورما", []],
  ]},
  { id: "sandwich", title: "سندويش كريسبي", items: [
    ["كريسبي تشيدر", crispy("صوص تشيدر")],
    ["كريسبي سبايسي", crispy("صوص سبايسي")],
    ["كريسبي هاني ماسترد", crispy("صوص هاني ماسترد")],
    ["كريسبي كوكتيل", crispy("صوص كوكتيل")],
    ["كريسبي بوفالو", crispy("صوص بوفالو")],
    ["كريسبي داينمت", crispy("صوص داينمت")],
    ["كريسبي هالبينو", crispy("صوص تشيدر")],
    ["كريسبي باربيكيو", crispy("صوص باربيكيو")],
    ["كريسبي سويت أند تشيلي", crispy("صوص سويت أند تشيلي")],
    ["كريسبي بونزو", crispy("صوص بونزو")],
  ]},
  { id: "beef", title: "برغر لحم", items: [
    ["جوسي لوسي", ["لحم", "خس", "مايونيز", "حبش", "تشيدر", "موزاريلا", "مخلل", "صوص جوسي لوسي"]],
    ["داينمت لحم", ["لحم", "خس", "مايونيز", "مخلل", "تشيدر", "بندورة", "صوص داينمت"]],
    ["ماشروم لحم", ["لحم", "خس", "مايونيز", "فطر فريش", "تشيدر", "صوص ماشروم"]],
    ["سويت أند تشيلي لحم", ["لحم", "مايونيز", "تشيدر", "خس", "مخلل", "صوص سويت أند تشيلي"]],
  ]},
  { id: "chicken", title: "برغر دجاج", items: [
    ["بونزو برغر", ["دجاج مقلي بالكورنفلكس", "خس", "تشيدر", "بصل", "فطر", "صوص بونزو"]],
    ["سويت أند تشيلي", ["دجاج مقلي بالكورنفلكس", "مايونيز", "خس", "مخلل", "تشيدر", "صوص سويت أند تشيلي"]],
    ["داينمت", ["دجاج مقلي", "خس", "مخلل", "بندورة", "تشيدر", "حبش", "صوص داينمت", "قطع هالبينو"]],
    ["ميكس تشيز", ["دجاج مقلي", "خس", "مايونيز", "تشيدر", "موزاريلا", "قشقوان", "ذرة", "حبش"]],
  ]},
  { id: "fatteh", title: "فتات", items: [
    ["فتة شاورما", ["100غ شاورما", "150غ رز", "صوص طحينية"]],
    ["فتة كريسبي", ["4 قطع دجاج", "بطاطا", "ميكس صوص"]],
  ]},
  { id: "starters", title: "مقبلات", simple: true, items: [
    ["صحن بطاطا", []], ["صحن بطاطا تشيدر", []], ["بطاطا بوفلو", []], ["أصابع موزاريلا", []], ["تشكن ناغيت", []],
  ]},
];
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("tabs").innerHTML = MENU.map((c, i) => `<a href="#${c.id}"${i ? "" : ' class="on"'}>${esc(c.title)}</a>`).join("");
document.getElementById("menu").innerHTML = MENU.map((c) => `
  <section id="${c.id}"><h2>${esc(c.title)}</h2><div class="items${c.simple ? " simple" : ""}">${c.items.map(([name, parts]) => `
    <article class="item"><h3>${esc(name)}</h3>${parts.length ? `<ul class="chips">${parts.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}</article>`).join("")}
  </div></section>`).join("");
// Highlight the tab of the section in view.
const tabs = [...document.querySelectorAll("nav a")];
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (!e.isIntersecting) return;
    tabs.forEach((t) => t.classList.toggle("on", t.getAttribute("href") === "#" + e.target.id));
  });
}, { rootMargin: "-40% 0px -55% 0px" });
document.querySelectorAll("main section").forEach((s) => io.observe(s));
</script>
</body>
</html>
